name: Android wall placement repair
# Verified local fingerprint matches the corrected personal-artwork native build.
# Recompute and compare before reuse after native/config/dependency changes.
jobs:
  source_build:
    type: get-build
    params:
      platform: android
      profile: preview
      distribution: internal
      fingerprint_hash: e0d09ec1f2708dfd8bbc1762c96210b706e24ca7
      wait_for_in_progress: true
  repack_preview:
    name: AR wall placement fixed APK
    type: repack
    needs: [source_build]
    if: ${{ needs.source_build.outputs.build_id }}
    environment: preview
    params:
      build_id: ${{ needs.source_build.outputs.build_id }}
      profile: preview
      js_bundle_only: true
      embed_bundle_assets: true
      repack_version: 0.10.4
      message: Fix native vertical plane alignment, AR availability retries and texture validation
