name: Repackage final verified JavaScript
# Manual only. This native identity was compared against the local final source.
# Recalculate and review this hash after any native/config/dependency changes.
jobs:
  source_build:
    type: get-build
    params:
      platform: android
      profile: preview
      distribution: internal
      fingerprint_hash: 285d3654ee24b6a734d230cfc3694da5c80daf7f
      wait_for_in_progress: true
  repack_preview:
    name: Final source preview APK
    type: repack
    needs: [source_build]
    if: ${{ needs.source_build.outputs.build_id }}
    environment: preview
    params:
      build_id: ${{ needs.source_build.outputs.build_id }}
      profile: preview
      js_bundle_only: true
      embed_bundle_assets: true
      repack_version: 0.10.4
      message: Final verified MVP with safe auth profiles and optimistic favorite rollback
